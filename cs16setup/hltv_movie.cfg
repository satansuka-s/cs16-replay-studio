// cs16db local HLTV recording config.
// Launched by record_hltv.bat: hltv.exe -port 27020 +exec hltv_movie.cfg
// Start a local game server first (or "listen server" from the game),
// then run the bat - HLTV joins the match and records EVERYTHING
// (all players, no interpolation = the best demo for the cs16db pipeline).
name "cs16db_hltv"
delay 5
maxclientrate 10000
spectate 1
record cs16_match
connect 127.0.0.1:27015
