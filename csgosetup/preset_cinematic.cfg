// ============================================================
//  CS:GO - cinematic preset (стиль «кино» для mirv_streams записи)
//  Дополняет mirv_streams_movie.cfg: DoF и тонирование по умолчанию,
//  чистый кадр 16:9, плавная камера.
// ============================================================

// tonemap/brightness приминг уже сделан в mirv_streams_movie.cfg (norm)
// здесь - только кино-настройки:

// камера: плавные переходы наключевые точки (Smoother-Demos)
mirv_cam smooth 1

// DoF: включает линз-блюр композита (в mirv_streams: doDepthOfField)
mirv_streams add baseFx cineDoF
mirv_streams edit cineDoF doBloomAndToneMapping default
mirv_streams edit cineDoF doDepthOfField 1
mirv_streams edit cineDoF record 0

// движковые настройки чистого кадра
mat_motion_blur 0
fps_max 0               // не ограничивать (host_framerate управляет записью)

// запись: 60 fps классика
host_framerate 60
mirv_streams record fps 60

echo "=== cinematic preset loaded: mirv_streams record start/end ==="
