// ============================================================
//  CS:S + HLAE: mirv_streams экранная запись (screen record)
//  Полный mirv_streams (depth/matte) у CS:S недоступен - только
//  запись экрана с host_framerate (см. вики advancedfx
//  "Source:mirv_streams" -> "Recording other games than CS:GO").
//  Использование:
//    host_framerate 1200; mirv_streams record fps 1200;
//    mirv_streams record start;  ... закрыть консоль ...
//    mirv_streams record end; host_framerate 0
// ============================================================
engine_no_focus_sleep 0
snd_mute_losefocus 0
snd_mix_async 0

mirv_streams record fps 1200
mirv_streams record settings afxFFmpegYuv420p

echo "=== screen record готов: mirv_streams record start / (F10 в movie.cfg стоп) ==="
