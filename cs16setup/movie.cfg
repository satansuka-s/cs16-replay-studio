// ============================================================
//  cs16db Movie/Demo Toolkit - CS 1.6 cinematic recording set
//  Loaded automatically from autoexec.cfg (exec movie.cfg)
//  In-game: exec movie.cfg   to re-apply after a map change.
//
//  BUTTONS
//    F4  fresh round start (sv_restart - clean timebase for demo)
//    F5  bot actors: freeze/thaw (bot_stop) + fill T/CT bots
//    F6  start demo recording (cycles rec1 / rec2 / rec3)
//    F7  stop recording & save
//    F8  third person camera on/off
//    F9  slow motion: x1 -> x0.5 -> x0.25 -> x0.1 -> x1
//    F10 clean HUD on/off (may not work in CS; see README)
//    F11 hide/show weapon model (r_drawviewmodel)
// ============================================================

// ---- quality ----
fps_max 300                  // smooth camera/positional data in the demo
cl_showfps 1
gl_vsync 0
gl_texturemode GL_LINEAR_MIPMAP_LINEAR
r_shadows 1
mat_specular 0               // harmless if missing

// ---- singleplayer authoring helpers ----
sv_cheats 1                  // required for thirdperson / timescale
mp_freezetime 0
mp_roundtime 60

// ---- demo recording (F6 / F7) ----
alias _rec1 "stop; record rec1; alias _rec _rec2; echo [cs16db] REC demo rec1"
alias _rec2 "stop; record rec2; alias _rec _rec3; echo [cs16db] REC demo rec2"
alias _rec3 "stop; record rec3; alias _rec _rec1; echo [cs16db] REC demo rec3"
alias _rec "_rec1"
alias _stop "stop; echo [cs16db] demo saved"
bind f6 "_rec"
bind f7 "_stop"

// ---- clean round start (F4) ----
alias _fresh "sv_restart 1; echo [cs16db] fresh round - timebase reset"
bind f4 "_fresh"

// ---- third person camera (F8) ----
alias _tp_on  "thirdperson; cam_idealdist 240; cam_idealyaw 55; cam_idealpitch -15; cam_snapto 60; alias _tpw _tp_off; echo [cs16db] THIRD PERSON"
alias _tp_off "firstperson; alias _tpw _tp_on; echo [cs16db] FIRST PERSON"
alias _tpw "_tp_on"
bind f8 "_tpw"

// ---- slow motion cycle (F9) ----
alias _ts1 "host_timescale 1.0; alias _tsw _ts2; echo [cs16db] timescale x1.0"
alias _ts2 "host_timescale 0.5; alias _tsw _ts3; echo [cs16db] timescale x0.5"
alias _ts3 "host_timescale 0.25; alias _tsw _ts4; echo [cs16db] timescale x0.25"
alias _ts4 "host_timescale 0.1; alias _tsw _ts1; echo [cs16db] timescale x0.1"
alias _tsw "_ts1"
bind f9 "_tsw"

// ---- clean HUD (F10) ----
alias _hud_on  "hud_draw 0; echo [cs16db] HUD hidden"
alias _hud_off "hud_draw 1; echo [cs16db] HUD shown"
alias _hudw "_hud_on"
bind f10 "_hudw"

// ---- weapon viewmodel (F11) ----
alias _vm_on  "r_drawviewmodel 1; echo [cs16db] viewmodel on"
alias _vm_off "r_drawviewmodel 0; echo [cs16db] viewmodel off"
alias _vmw "_vm_off"
bind f11 "_vmw"

// ---- bot actors for staged scenes (F5) ----
alias _bots_freeze "bot_stop 1; echo [cs16db] bots FROZEN (actors in place)"
alias _bots_thaw   "bot_stop 0; echo [cs16db] bots moving"
alias _bots_fill   "bot_add_t; bot_add_t; bot_add_ct; bot_add_ct; echo [cs16db] bots added"
alias _bw "_bots_freeze"
bind f5 "_bw"

echo [cs16db] movie.cfg loaded - F4 fresh / F5 bots / F6 record / F7 stop / F8 cam / F9 slow-mo / F10 hud / F11 viewmodel
