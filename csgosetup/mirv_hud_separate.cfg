// ============================================================
//  CS:GO - separate HUD stream (по туториалу advancedfx
//  "Tutorial: CS:GO Separate HUD Stream").
//
//  Слои:
//    main      - игра БЕЗ HUD (чистый композит),
//    hudBlack  - HUD на чёрном фоне,
//    hudWhite  - HUD на белом фоне.
//
//  В After Effects:
//    alpha = 1 - (hudWhite - hudBlack)            // маска HUD
//    result = bg * alpha + (hudWhite - hudBlack)  // или формула вики:
//    aeGame = (hudWhite-hudBlack)*bg + hudBlack
// ============================================================

// чистый кадр без HUD
mirv_streams add normal main
mirv_streams edit main drawHud 0

// HUD на чёрном фоне (clearBeforeHud — свойство BaseFx-стримов)
mirv_streams add baseFx hudBlack
mirv_streams edit hudBlack clearBeforeHud black
mirv_streams edit hudBlack drawHud 1

// HUD на белом фоне
mirv_streams add baseFx hudWhite
mirv_streams edit hudWhite clearBeforeHud white
mirv_streams edit hudWhite drawHud 1

echo "=== HUD separated: main / hudBlack / hudWhite ==="
