// ============================================================
//  CS:GO + HLAE (advancedfx) - mirv_streams movie preset
//  Запускать в консоли игры (или F9 из movie.cfg):
//    normal: обычный рендер (композит для AE)
//    depth : глубина (OpenEXR, 23-bit) для фокус/DOF в композе
//    ent   : матте сущностей (игроки белые, мир чёрный)
//    wrld  : матте мира (мир белый, игроки чёрные)
//  Запись: mirv_streams record start ... mirv_streams record end
//  (host_framerate 60; host_timescale 0; mirv_snd_timescale 1)
// ============================================================

// --- приминг сцены (tonemap/brightness) обычным стримом ---
mirv_streams add normal norm
mirv_streams edit norm record 0
mirv_streams mainStream set norm

// --- композитный (главный) стрим ---
mirv_streams add baseFx main
mirv_streams edit main doBloomAndToneMapping default
mirv_streams edit main doDepthOfField default
mirv_streams edit main settings afxFFmpegYuv420p

// --- глубина (OpenEXR): 7..8192 в 1/16 дюйма ---
mirv_streams add depth depth
mirv_streams edit depth depthVal 7
mirv_streams edit depth depthValMax 8192
mirv_streams edit depth drawZ rgb
mirv_streams edit depth drawZMode linear
mirv_streams edit depth captureType depth24
mirv_streams edit depth settings afxFFmpegLosslessBest

// --- матте сущностей и мира ---
mirv_streams add matteEntity ent
mirv_streams edit ent settings afxFFmpegYuv420p
mirv_streams add matteWorld wrld
mirv_streams edit wrld settings afxFFmpegYuv420p

// --- глубина для ent (опц.) ---
mirv_streams add depthEntity dent
mirv_streams edit dent depthVal 7
mirv_streams edit dent depthValMax 8192

mirv_streams record name csgo_movie

echo "=== mirv_streams preset: main+depth+ent+wrld готовы. mirv_streams record start ==="
