// ============================================================
//  Counter-Strike: Source - cinema kit movie.cfg
//  F6 = запись демки, F7 = стоп, F8 = demoui,
//  F9 = экранная запись HLAE (mirv_streams record screen)
// ============================================================

sv_cheats 1

// --- чистота кадра ---
cl_drawhud 0
r_drawviewmodel 0
mat_motion_blur 0
fps_max 300
engine_no_focus_sleep 0
snd_mute_losefocus 0
snd_mix_async 0

// --- привязки ---
bind "F6" "record css_movie"
bind "F7" "stop"
bind "F8" "demoui 1"
bind "F9" "exec mirv_screen_record"

echo "=== CS:S cinema kit loaded (F6 record / F7 stop / F9 HLAE screen record) ==="
