// ============================================================
//  CS:GO (Source 1, legacy build) - cinema kit movie.cfg
//  Для «одной кнопки»: демка -> демо-экстрактор -> Blender/AE
//  F6  = запись демки (record), F7 = стоп, F8 = показ в demoui
//  Пресеты HLAE (mirv_streams) - F9  = видеозапись (стримы),
//  F10 = стоп записи.  TM важно: mirv_* команды доступны только
//  при запуске через HLAE (AfxHookSource).
// ============================================================

sv_cheats 1

// --- чистота кадра для кино (движковые) ---
cl_drawhud 0
r_drawviewmodel 0
mat_motion_blur 0
fps_max 300
engine_no_focus_sleep 0
snd_mute_losefocus 0
snd_mix_async 0

// --- плавная демка (Smoother-Demos): тик с фикс. частоты ---
host_timescale 1

// --- привязки ---
bind "F6" "record csgo_movie"
bind "F7" "stop"
bind "F8" "demoui 1"
bind "F9" "exec mirv_streams_movie"
bind "F10" "mirv_streams record end; host_framerate 0"

echo "=== CS:GO cinema kit loaded (F6 record / F7 stop / F9 mirv streams) ==="
